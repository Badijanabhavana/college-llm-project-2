<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | JNTU-GV College Enquiry System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #F3F8FF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 18px;
            box-shadow: 0 4px 6px rgba(15,23,42,0.04), 0 10px 40px rgba(30,64,175,0.08);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
            padding: 1.8rem 2rem 1.6rem;
            text-align: center;
        }

        .logo-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 11px;
            margin-bottom: 1rem;
        }

        .logo-icon-box {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.18);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .logo-text-group { text-align: left; }

        .logo-text-group .uni-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .logo-text-group .uni-sub {
            font-size: 0.68rem;
            color: rgba(255,255,255,0.75);
            margin-top: 2px;
        }

        /* Admin badge strip */
        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.30);
            border-radius: 20px;
            padding: 4px 12px;
            margin-bottom: 0.75rem;
            font-size: 0.72rem;
            font-weight: 600;
            color: rgba(255,255,255,0.90);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .card-header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.35;
            margin-bottom: 0.25rem;
        }

        .card-header p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.72);
        }

        .card-body { padding: 1.8rem 2rem 2rem; }

        .alert {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            border-radius: 9px;
            padding: 0.65rem 0.9rem;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            line-height: 1.45;
        }
        .alert svg { flex-shrink: 0; margin-top: 1px; }
        .alert-error  { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
        .alert-success{ background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }

        .field { margin-bottom: 1rem; }

        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #1E3A8A;
            margin-bottom: 0.38rem;
            letter-spacing: 0.01em;
        }

        .input-wrap { position: relative; }

        .input-wrap .fi {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: #93C5FD;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.72rem 2.6rem 0.72rem 2.5rem;
            border: 1.5px solid #DBEAFE;
            border-radius: 9px;
            font-size: 0.93rem;
            color: #0F172A;
            background: #F8FBFF;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
        }

        .input-wrap input::placeholder { color: #94A3B8; }

        .input-wrap input:focus {
            border-color: #2563EB;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        .eye-btn {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            color: #93C5FD;
            display: flex;
            align-items: center;
            transition: color 0.18s;
        }
        .eye-btn:hover { color: #2563EB; }

        .btn-submit {
            width: 100%;
            padding: 0.8rem;
            margin-top: 0.6rem;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #1E40AF 0%, #2563EB 100%);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37,99,235,0.28);
            transition: transform 0.18s, box-shadow 0.18s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(37,99,235,0.36);
        }
        .btn-submit:active { transform: translateY(0); }

        .card-footer {
            border-top: 1px solid #EFF6FF;
            padding: 1rem 2rem 1.4rem;
            text-align: center;
        }

        .card-footer p {
            font-size: 0.84rem;
            color: #64748B;
        }

        .card-footer a {
            color: #2563EB;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.18s;
        }
        .card-footer a:hover {
            color: #1D4ED8;
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="auth-card">

    <!-- Header -->
    <div class="card-header">
        <div class="logo-row">
            <div class="logo-icon-box">🎓</div>
            <div class="logo-text-group">
                <div class="uni-name">JNTU-GV</div>
                <div class="uni-sub">College of Engineering, Vizianagaram</div>
            </div>
        </div>
        <div class="admin-badge">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            Administrator Access
        </div>
        <h1>Administrator Login</h1>
        <p>Restricted to authorised college staff only.</p>
    </div>

    <!-- Body -->
    <div class="card-body">

        {% if error %}
        <div class="alert alert-error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            {{ error }}
        </div>
        {% endif %}

        {% if msg %}
        <div class="alert alert-success">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            {{ msg }}
        </div>
        {% endif %}

        <form method="POST" action="/login">

            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <span class="fi">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    </span>
                    <input type="text" id="username" name="username" placeholder="Admin username" required autocomplete="username">
                </div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="fi">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </span>
                    <input type="password" id="password" name="password" placeholder="Admin password" required autocomplete="current-password">
                    <button type="button" class="eye-btn" id="eye-btn" aria-label="Show password">
                        <svg id="ico-eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        <svg id="ico-eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Login as Administrator</button>
        </form>
    </div>

    <!-- Footer -->
    <div class="card-footer">
        <p><a href="/login">&#8592; Back to Student Login</a></p>
    </div>

</div>

<script>
    const eyeBtn  = document.getElementById('eye-btn');
    const pwdFld  = document.getElementById('password');
    const icoOn   = document.getElementById('ico-eye');
    const icoOff  = document.getElementById('ico-eye-off');

    eyeBtn.addEventListener('click', () => {
        const show = pwdFld.type === 'password';
        pwdFld.type      = show ? 'text' : 'password';
        icoOn.style.display  = show ? 'none'  : '';
        icoOff.style.display = show ? ''      : 'none';
        eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
</script>
</body>
</html>
