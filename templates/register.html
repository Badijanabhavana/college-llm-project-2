<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | JNTU-GV College Enquiry System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #F3F8FF;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: 18px;
            box-shadow: 0 4px 6px rgba(15,23,42,0.04), 0 10px 40px rgba(30,64,175,0.08);
            overflow: hidden;
        }

        /* ── Header ── */
        .card-header {
            background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
            padding: 1.8rem 2rem 1.6rem;
            text-align: center;
        }
        .logo-row {
            display: flex; align-items: center; justify-content: center;
            gap: 11px; margin-bottom: 1rem;
        }
        .logo-icon-box {
            width: 44px; height: 44px;
            background: rgba(255,255,255,0.18);
            border-radius: 10px; display: flex;
            align-items: center; justify-content: center;
            font-size: 1.5rem; flex-shrink: 0;
        }
        .logo-text-group { text-align: left; }
        .logo-text-group .uni-name {
            font-size: 0.85rem; font-weight: 700; color: #ffffff;
            letter-spacing: 0.06em; text-transform: uppercase;
        }
        .logo-text-group .uni-sub {
            font-size: 0.68rem; color: rgba(255,255,255,0.75); margin-top: 2px;
        }
        .card-header h1 {
            font-size: 1.15rem; font-weight: 700; color: #ffffff;
            line-height: 1.35; margin-bottom: 0.25rem;
        }
        .card-header p { font-size: 0.8rem; color: rgba(255,255,255,0.72); }

        /* ── Body ── */
        .card-body { padding: 1.8rem 2rem 2rem; }

        /* Server-side error alert */
        .alert {
            display: flex; align-items: flex-start; gap: 9px;
            border-radius: 9px; padding: 0.65rem 0.9rem;
            font-size: 0.85rem; margin-bottom: 1.2rem; line-height: 1.45;
        }
        .alert svg { flex-shrink: 0; margin-top: 1px; }
        .alert-error   { background: #FEF2F2; color: #B91C1C; border: 1px solid #FECACA; }
        .alert-success { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }

        /* ── Field ── */
        .field { margin-bottom: 1rem; }

        .field label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: #1E3A8A; margin-bottom: 0.38rem; letter-spacing: 0.01em;
        }

        .input-wrap { position: relative; }

        .input-wrap .fi {
            position: absolute; left: 0.85rem; top: 50%;
            transform: translateY(-50%); color: #93C5FD;
            pointer-events: none; display: flex; align-items: center;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.72rem 2.6rem 0.72rem 2.5rem;
            border: 1.5px solid #DBEAFE; border-radius: 9px;
            font-size: 0.93rem; color: #0F172A; background: #F8FBFF;
            outline: none;
            transition: border-color 0.18s, box-shadow 0.18s, background 0.18s;
            font-family: inherit;
        }
        .input-wrap input::placeholder { color: #94A3B8; }
        .input-wrap input:focus {
            border-color: #2563EB; background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
        }

        /* Validation states */
        .input-wrap input.is-invalid {
            border-color: #F87171;
            background: #FFF5F5;
            box-shadow: 0 0 0 3px rgba(248,113,113,0.12);
        }
        .input-wrap input.is-valid {
            border-color: #34D399;
            background: #F0FDF4;
            box-shadow: 0 0 0 3px rgba(52,211,153,0.10);
        }

        /* Validation tick/cross icon inside the field */
        .input-wrap .vi {
            position: absolute; right: 0.78rem; top: 50%;
            transform: translateY(-50%);
            display: none; pointer-events: none;
        }
        .input-wrap input.is-valid  ~ .vi.ok  { display: flex; }
        .input-wrap input.is-invalid ~ .vi.err { display: flex; }

        /* Eye toggle (password field only — sits before the vi icons) */
        .eye-btn {
            position: absolute; right: 0.75rem; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            padding: 2px; color: #93C5FD;
            display: flex; align-items: center; transition: color 0.18s;
        }
        .eye-btn:hover { color: #2563EB; }

        /* Field-level validation message */
        .field-msg {
            display: none;
            font-size: 0.76rem;
            margin-top: 0.32rem;
            padding-left: 0.2rem;
            line-height: 1.4;
        }
        .field-msg.error { color: #DC2626; display: flex; align-items: center; gap: 4px; }
        .field-msg.ok    { color: #059669; display: flex; align-items: center; gap: 4px; }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%; padding: 0.8rem; margin-top: 0.8rem;
            border: none; border-radius: 9px;
            background: linear-gradient(135deg, #1E40AF 0%, #2563EB 100%);
            color: #ffffff; font-size: 0.95rem; font-weight: 600;
            letter-spacing: 0.02em; cursor: pointer;
            box-shadow: 0 4px 14px rgba(37,99,235,0.28);
            transition: transform 0.18s, box-shadow 0.18s, opacity 0.18s;
            font-family: inherit;
        }
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(37,99,235,0.36);
        }
        .btn-submit:active:not(:disabled) { transform: translateY(0); }

        /* ── Footer ── */
        .card-footer {
            border-top: 1px solid #EFF6FF;
            padding: 1rem 2rem 1.4rem; text-align: center;
        }
        .card-footer p { font-size: 0.84rem; color: #64748B; }
        .card-footer a {
            color: #2563EB; font-weight: 600; text-decoration: none; transition: color 0.18s;
        }
        .card-footer a:hover { color: #1D4ED8; text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">

    <!-- Header -->
    <div class="card-header">
        <div class="logo-row">
            <div class="logo-icon-box">🎓</div>
            <div class="logo-text-group">
                <div class="uni-name">JNTU-GV</div>
                <div class="uni-sub">College of Engineering, Vizianagaram</div>
            </div>
        </div>
        <h1>Create Your Account</h1>
        <p>Join the JNTU-GV College Enquiry System.</p>
    </div>

    <!-- Body -->
    <div class="card-body">

        {% if error %}
        <div class="alert alert-error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/register" id="reg-form" novalidate>

            <!-- Username -->
            <div class="field">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <span class="fi">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input type="text" id="username" name="username"
                           placeholder="Minimum 3 characters"
                           autocomplete="username">
                    <!-- state icons -->
                    <span class="vi ok" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                    <span class="vi err" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </span>
                </div>
                <div class="field-msg" id="username-msg"></div>
            </div>

            <!-- Email -->
            <div class="field">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <span class="fi">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                            <polyline points="22,6 12,13 2,6"/>
                        </svg>
                    </span>
                    <input type="text" id="email" name="email"
                           placeholder="name@example.com"
                           autocomplete="email">
                    <span class="vi ok" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                    <span class="vi err" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </span>
                </div>
                <div class="field-msg" id="email-msg"></div>
            </div>

            <!-- Mobile -->
            <div class="field">
                <label for="mobile">Mobile Number</label>
                <div class="input-wrap">
                    <span class="fi">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
                            <line x1="12" y1="18" x2="12.01" y2="18"/>
                        </svg>
                    </span>
                    <input type="text" id="mobile" name="mobile"
                           placeholder="10-digit number"
                           autocomplete="tel" inputmode="numeric" maxlength="10">
                    <span class="vi ok" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                    <span class="vi err" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </span>
                </div>
                <div class="field-msg" id="mobile-msg"></div>
            </div>

            <!-- Password -->
            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <span class="fi">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input type="password" id="password" name="password"
                           placeholder="Minimum 6 characters"
                           autocomplete="new-password">
                    <!-- eye toggle — right-offset leaves room for the vi icons -->
                    <button type="button" class="eye-btn" id="eye-btn"
                            aria-label="Show password"
                            style="right:2.1rem;">
                        <svg id="ico-eye" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg id="ico-eye-off" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                    <span class="vi ok" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                    <span class="vi err" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </span>
                </div>
                <div class="field-msg" id="password-msg"></div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Create Account</button>
        </form>
    </div>

    <!-- Footer -->
    <div class="card-footer">
        <p>Already have an account? <a href="/login">Login here</a></p>
    </div>

</div>

<script>
(function () {
    /* ── helpers ── */
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function getField(id) {
        return document.getElementById(id);
    }

    /**
     * Mark a field valid or invalid.
     * @param {HTMLInputElement} input
     * @param {string}           msgId   – id of the .field-msg element
     * @param {boolean}          valid
     * @param {string}           message – shown when invalid
     * @param {string}           okText  – shown when valid (optional)
     */
    function setValidity(input, msgId, valid, message, okText) {
        const msg = document.getElementById(msgId);

        input.classList.toggle('is-valid',   valid);
        input.classList.toggle('is-invalid', !valid);

        msg.className   = 'field-msg ' + (valid ? 'ok' : 'error');
        msg.textContent = valid ? (okText || '') : message;

        // hide the ok message if there's nothing to show
        if (valid && !okText) msg.className = 'field-msg';
    }

    /**
     * Reset a field to its neutral state (no colour, no message).
     */
    function clearValidity(input, msgId) {
        input.classList.remove('is-valid', 'is-invalid');
        const msg = document.getElementById(msgId);
        msg.className   = 'field-msg';
        msg.textContent = '';
    }

    /* ── per-field validators ── */
    function validateUsername() {
        const input = getField('username');
        const v = input.value.trim();
        if (!v)           { setValidity(input, 'username-msg', false, 'Username is required.'); return false; }
        if (v.length < 3) { setValidity(input, 'username-msg', false, 'Username must be at least 3 characters.'); return false; }
        setValidity(input, 'username-msg', true, '', 'Looks good!');
        return true;
    }

    function validateEmail() {
        const input = getField('email');
        const v = input.value.trim();
        if (!v)              { setValidity(input, 'email-msg', false, 'Email address is required.'); return false; }
        if (!EMAIL_RE.test(v)) { setValidity(input, 'email-msg', false, 'Enter a valid email (e.g. name@gmail.com).'); return false; }
        setValidity(input, 'email-msg', true, '', 'Looks good!');
        return true;
    }

    function validateMobile() {
        const input = getField('mobile');
        const v = input.value.trim();
        if (!v)               { setValidity(input, 'mobile-msg', false, 'Mobile number is required.'); return false; }
        if (!/^\d{10}$/.test(v)) { setValidity(input, 'mobile-msg', false, 'Enter exactly 10 digits (numbers only).'); return false; }
        setValidity(input, 'mobile-msg', true, '', 'Looks good!');
        return true;
    }

    function validatePassword() {
        const input = getField('password');
        const v = input.value;
        if (!v)          { setValidity(input, 'password-msg', false, 'Password is required.'); return false; }
        if (v.length < 6) { setValidity(input, 'password-msg', false, 'Password must be at least 6 characters.'); return false; }
        setValidity(input, 'password-msg', true, '', 'Looks good!');
        return true;
    }

    /* ── block non-numeric input on mobile field ── */
    getField('mobile').addEventListener('input', function () {
        this.value = this.value.replace(/\D/g, '').slice(0, 10);
    });

    /* ── live validation on blur (validate when user leaves a field) ── */
    getField('username').addEventListener('blur', validateUsername);
    getField('email').addEventListener('blur', validateEmail);
    getField('mobile').addEventListener('blur', validateMobile);
    getField('password').addEventListener('blur', validatePassword);

    /* ── also clear error as soon as user starts correcting a field ── */
    ['username', 'email', 'mobile', 'password'].forEach(id => {
        getField(id).addEventListener('input', function () {
            if (this.classList.contains('is-invalid')) {
                clearValidity(this, id + '-msg');
            }
        });
    });

    /* ── form submit ── */
    document.getElementById('reg-form').addEventListener('submit', function (e) {
        const ok = [
            validateUsername(),
            validateEmail(),
            validateMobile(),
            validatePassword()
        ].every(Boolean);      // run all four so all errors show at once

        if (!ok) {
            e.preventDefault(); // block submission — let user fix errors
            // scroll to the first invalid field
            const first = this.querySelector('.is-invalid');
            if (first) first.focus();
        }
        // if all pass, the form submits normally to /register (POST)
    });

    /* ── show / hide password ── */
    const eyeBtn = document.getElementById('eye-btn');
    const pwdFld = document.getElementById('password');
    const icoOn  = document.getElementById('ico-eye');
    const icoOff = document.getElementById('ico-eye-off');

    eyeBtn.addEventListener('click', () => {
        const show = pwdFld.type === 'password';
        pwdFld.type          = show ? 'text'    : 'password';
        icoOn.style.display  = show ? 'none'    : '';
        icoOff.style.display = show ? ''        : 'none';
        eyeBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
})();
</script>
</body>
</html>
