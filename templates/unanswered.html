<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unanswered Questions | JNTU-GV</title>
    <link rel="stylesheet" href="/static/student.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo-box">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">JNTU-GV Enquiry</span>
            </div>
        </div>
        <nav class="sidebar-menu">
            <a href="/admin" class="menu-item"><span class="menu-icon">📊</span><span class="menu-text">Admin Dashboard</span></a>
            <a href="/home" class="menu-item"><span class="menu-icon">🏠</span><span class="menu-text">Home</span></a><span class="menu-icon">❓</span><span class="menu-text">Unanswered Questions</span></a>
            <a href="/admin/chat_history" class="menu-item"><span class="menu-icon">💬</span><span class="menu-text">Chat History</span></a>
            <a href="/admin/feedback" class="menu-item"><span class="menu-icon">⭐</span><span class="menu-text">Feedback</span></a>
            <a href="/logout" class="menu-item" style="margin-top: auto;"><span class="menu-icon">🚪</span><span class="menu-text">Logout</span></a>
        </nav>
    </aside>

    <main class="main-container">
        <nav class="page-topbar">
            <div class="topbar-logo">🎓 JNTU-GV</div>
        </nav>

        <div class="page-wrapper">
            <div class="page-heading">
                <h1>❓ Unanswered Questions</h1>
                <p>Review and resolve the queries that the chatbot failed to understand or respond to.</p>
            </div>

            <div class="card-grid" id="unanswered-grid">
                <div class="empty-state" style="grid-column:1/-1;">Loading questions…</div>
            </div>
        </div>
    </main>

    <script>
        async function fetchUnanswered() {
            try {
                const res = await fetch('/api/unanswered');
                const questions = await res.json();
                const grid = document.getElementById('unanswered-grid');

                if (questions.length === 0) {
                    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">🎉 Great job! The bot has successfully answered all questions.</div>';
                    return;
                }

                let html = '';
                questions.forEach(q => {
                    html += `<div class="question-card">
                        <div class="q-header">
                            <span class="q-user">@${q.username}</span>
                            <span>${q.timestamp}</span>
                        </div>
                        <div class="q-text">"${q.query}"</div>
                        <button class="btn-resolve" onclick="alert('In a real system, you would add an intent for this query.')">Resolve Query</button>
                    </div>`;
                });
                grid.innerHTML = html;
            } catch (e) {
                console.error("Error fetching unanswered questions:", e);
            }
        }

        fetchUnanswered();
        setInterval(fetchUnanswered, 5000);
    </script>
</body>
</html>
