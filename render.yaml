services:
  - type: web
    name: college-llm
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DB_PATH
        value: /data/database.db
      - key: RAG_INDEX_DIR
        value: /data/rag_index
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
